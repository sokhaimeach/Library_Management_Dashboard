<div class="page-wrapper">
    <div class="auth-card">
        <!-- Form Section -->
        <div class="form-section">
            <h2 class="login-title">Login</h2>

            <!-- login by username and password -->
            <form [class]="!loginByEmail ? 'd-flex flex-column' : 'd-none'" (submit)="login(); $event.preventDefault()">
                <div class="auth-input-group">
                    <label class="input-label">Username or email</label>
                    <input type="text" placeholder="Enter your ID" class="form-control inputs" [(ngModel)]="username"
                        name="username">
                </div>
                <div class="auth-input-group mb-2">
                    <label class="input-label mb-2">Password</label>
                    <div class="position-relative">
                        <input [type]="showPassword ? 'text': 'password'" placeholder="Enter your password"
                            class="form-control inputs" [(ngModel)]="password" name="password">
                        <i class="bi" [ngClass]="showPassword ? 'bi-eye' : 'bi-eye-slash'" (click)="togglePassword()"
                            style="position: absolute; right: 15px; top: 18px; cursor: pointer; color: #9CA3AF;"></i>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check m-0">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                    </div>
                    <a class="forgot-link" style="cursor: pointer;">Forgot password ?</a>
                </div>

                <div class="alert-custom mb-3" *ngIf="message() !== ''">
                    <i class="bi bi-exclamation-circle-fill me-2"></i>
                    <span>{{message()}}</span>
                </div>

                <button type="submit" class="login-btn">Login</button>
            </form>

            <!-- login by email -->
            <form [class]="loginByEmail ? 'd-flex flex-column' : 'd-none'"
                (submit)="loginByEmailFn(); $event.preventDefault()">
                <div class="auth-input-group">
                    <label class="input-label">Email address</label>
                    <input type="email" placeholder="Enter your email" class="form-control inputs" [(ngModel)]="email"
                        name="email">
                </div>

                <div class="alert-custom mb-3" *ngIf="emailMess() !== ''">
                    <i class="bi bi-exclamation-circle-fill me-2"></i>
                    <span>{{emailMess()}}</span>
                </div>

                <button type="submit" class="login-btn">Login with Email</button>
            </form>

            <footer class="footer-text">
                Don't have an account ? <span class="signup-link" (click)="loginByEmail = !loginByEmail">
                    {{!loginByEmail ? 'Login by Email' : 'Login by username'}}
                </span>
            </footer>
        </div>

        <!-- Visual Section -->
        <div class="visual-section">
            <img src="/auth-illustration.png" alt="Library Illustration" class="illustration">
            <h3 class="visual-title">Knowledge is Power</h3>
            <p class="visual-desc">Access thousands of digital resources and manage your library activities seamlessly.
            </p>

        </div>
    </div>
</div>
